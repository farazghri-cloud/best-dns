name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag to publish (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm, goarm: '7' }
          - { goos: windows, goarch: amd64, ext: '.exe' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: vet & test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          go vet ./...
          go test ./...

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '0'
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          NAME="best-dns-${GOOS}-${GOARCH}"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/bestdns${{ matrix.ext }}" ./cmd/bestdns
          if [ "$GOOS" = "linux" ]; then
            tar -czf "dist/${NAME}.tar.gz" -C dist "bestdns${{ matrix.ext }}"
            ( cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256" )
            rm -f "dist/bestdns${{ matrix.ext }}"
          else
            ( cd dist && sha256sum "bestdns${{ matrix.ext }}" > "bestdns${GOOS}-${GOARCH}.exe.sha256" )
            mv "dist/bestdns${{ matrix.ext }}" "dist/${NAME}.exe"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: best-dns-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          body: |
            Prebuilt single binaries (no runtime dependencies).

            **Linux install (Ubuntu 22.04/24.04, Debian 12):**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sudo bash
            ```
            Asset naming: `best-dns-linux-<arch>.tar.gz` (+ `.sha256`).
